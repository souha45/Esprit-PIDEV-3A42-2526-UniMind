<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniMind - Carte de l'événement</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #map {
            height: 300px;
            width: 100%;
            border-radius: 8px;
            border: 2px solid #ddd;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map;
        let marker;

        // Initialiser la carte avec les coordonnées fournies
        function initMap(lat, lng, address) {
            if (lat && lng) {
                map = L.map('map').setView([lat, lng], 15);
                
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap contributors'
                }).addTo(map);

                // Ajouter le marqueur avec l'adresse exacte du champ lieu
                marker = L.marker([lat, lng]).addTo(map);
                
                if (address) {
                    marker.bindPopup(address).openPopup();
                }

                // Important dans JavaFX WebView/ScrollPane : forcer Leaflet à recalculer la taille
                // sinon la carte peut s'afficher partiellement (zone grise) et être mal centrée.
                setTimeout(() => {
                    map.invalidateSize();
                    map.setView([lat, lng], 15);
                }, 150);
            } else {
                // Si pas de coordonnées, afficher un message
                document.getElementById('map').innerHTML = 
                    '<div style="display: flex; align-items: center; justify-content: center; height: 100%; color: #95a5a6; font-size: 14px;">' +
                    'Coordonnées non disponibles pour cet événement' +
                    '</div>';
            }
        }
    </script>
</body>
</html>
